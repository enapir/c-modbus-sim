# Modbus slave simulator config (/etc/modbus-sim/config.yaml)
#
# .mbs ファイルごとに 1 セクション (blc / bamu1-4 / spcs1-12)。
# modbus-sim はセクションを展開して単一アドレス空間に統合し、
# FC03/FC04 両方で配信する (全ブロック FC03 定義)。
# 値は .mbs に保存されていた uint16 生値 (負値は二の補数、例 65302 = -234)。
# 値 0 かつ名前なし/Reserved のレジスタは省略 (シミュレータが 0 埋めする)。
#
# 注意:
#   - spcs10.mbs は spcs9.mbs と同一内容・同一開始アドレス (22200) のため統合。
#     spcs ブロックは 100 刻みで 22300 が欠番 — spcs10.mbs の設定ミスの可能性あり。
#   - Modbus Slave 上のスレーブ ID は全ファイル 1 のため単一スレーブ 1 に統合。
#
# 起動例:
#   modbus-sim config.yaml --mode tcp --port 5020 --verbose
#
# 別の定義に差し替える場合:
#   scp my_config.yml root@<router>:/etc/modbus-sim/config.yaml
#   /etc/init.d/modbus-sim restart

source: mbs/*.mbs (Modbus Slave 9.5.0.2346)

